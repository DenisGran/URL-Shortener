name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres 16 for integration tests, same image and credentials as
    # docker-compose.yml.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: rapid
          POSTGRES_PASSWORD: rapid
          POSTGRES_DB: rapid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rapid -d rapid"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://rapid:rapid@localhost:5432/rapid
    steps:
      # Actions are pinned to a commit SHA: a tag can be moved to other code, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # Python 3.12 comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app tests

      - name: Tests
        run: uv run pytest
