[project]
name = "rapid-codes"
version = "0.1.0"
description = "A URL shortener with measured performance: https://rapid.codes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    # [binary] ships libpq inside the wheel; [pool] adds psycopg_pool.
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    # [standard] adds uvloop and httptools: faster event loop and HTTP parser on Linux (Heroku).
    "uvicorn[standard]>=0.32",
]

[tool.uv]
# An application, not a library: nothing to build or publish.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B likely bugs,
# SIM simplifications, ASYNC blocking calls in async code, S security (bandit).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
# Lets mypy understand pydantic models, e.g. Settings() with fields read from the environment.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
